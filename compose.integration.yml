services:
  postgres-test:
    image: postgres:17.6
    environment:
      POSTGRES_USER: aigis_test
      POSTGRES_PASSWORD: local_test_only
      POSTGRES_DB: aigis_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aigis_test -d aigis_test"]
      interval: 2s
      timeout: 3s
      retries: 20
